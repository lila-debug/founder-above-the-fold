<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFEF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-second-job"
        class="scene" data-layout-allow-overflow
        data-composition-id="01-second-job"
        data-composition-src="compositions/frames/01-second-job.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-second-job-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="2.027"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-not-scheduler"
        class="scene" data-layout-allow-overflow
        data-composition-id="02-not-scheduler"
        data-composition-src="compositions/frames/02-not-scheduler.html"
        data-start="5"
        data-duration="6.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-not-scheduler-voice"
        src="assets/voice/02.wav"
        data-start="5"
        data-duration="5.568"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-name-machine"
        class="scene" data-layout-allow-overflow
        data-composition-id="03-name-machine"
        data-composition-src="compositions/frames/03-name-machine.html"
        data-start="11"
        data-duration="6.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-name-machine-voice"
        src="assets/voice/03.wav"
        data-start="11"
        data-duration="5.184"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-profile-parts"
        class="scene" data-layout-allow-overflow
        data-composition-id="04-profile-parts"
        data-composition-src="compositions/frames/04-profile-parts.html"
        data-start="17"
        data-duration="7.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-profile-parts-voice"
        src="assets/voice/04.wav"
        data-start="17"
        data-duration="6.720"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-visible-week"
        class="scene" data-layout-allow-overflow
        data-composition-id="05-visible-week"
        data-composition-src="compositions/frames/05-visible-week.html"
        data-start="24"
        data-duration="7.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-visible-week-voice"
        src="assets/voice/05.wav"
        data-start="24"
        data-duration="6.165"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-safety-rail"
        class="scene" data-layout-allow-overflow
        data-composition-id="06-safety-rail"
        data-composition-src="compositions/frames/06-safety-rail.html"
        data-start="31"
        data-duration="7.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-safety-rail-voice"
        src="assets/voice/06.wav"
        data-start="31"
        data-duration="5.653"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-finished-build"
        class="scene" data-layout-allow-overflow
        data-composition-id="07-finished-build"
        data-composition-src="compositions/frames/07-finished-build.html"
        data-start="38"
        data-duration="7"
        data-track-index="0"
      ></div>
      <audio
        id="el-07-finished-build-voice"
        src="assets/voice/07.wav"
        data-start="38"
        data-duration="6.272"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.loop.mp3"
        data-start="0"
        data-duration="45"
        data-track-index="11"
        data-volume="0.12"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene" data-layout-allow-overflow
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="45"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-second-job", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 5);
        tl.fromTo("#el-02-not-scheduler", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 5);
        tl.to("#el-02-not-scheduler", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 11);
        tl.fromTo("#el-03-name-machine", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 11);
        tl.to("#el-03-name-machine", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.fromTo("#el-04-profile-parts", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.to("#el-04-profile-parts", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 24);
        tl.fromTo("#el-05-visible-week", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 24);
        tl.to("#el-05-visible-week", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 31);
        tl.fromTo("#el-06-safety-rail", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 31);
        tl.to("#el-06-safety-rail", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 38);
        tl.fromTo("#el-07-finished-build", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 38);
        tl.to({}, { duration: 45 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
