<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Founder Above the Fold — LinkedIn Page Assembly</title>
  <style>
    :root { --teal:#68a89a; --ink:#0a0a0a; --paper:#f3f0e7; --yellow:#f3d35b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:Arial,sans-serif; }
    .manual { width:min(1180px,94vw); }
    .label { display:inline-block; margin-bottom:14px; padding:9px 14px; border:3px solid var(--ink); background:var(--yellow); font:700 14px/1 monospace; letter-spacing:.12em; }
    h1 { margin:0 0 18px; font-size:clamp(30px,5vw,68px); line-height:.92; letter-spacing:-.05em; }
    .stage { position:relative; overflow:hidden; aspect-ratio:16/9; border:4px solid var(--ink); background:var(--teal); }
    .panel { position:absolute; inset:0; opacity:0; transform:translateX(28px) scale(.995); transition:opacity 560ms ease, transform 560ms ease; pointer-events:none; }
    .panel.active { opacity:1; transform:none; pointer-events:auto; }
    .panel img { width:100%; height:100%; object-fit:cover; display:block; }
    .caption { position:absolute; left:0; right:0; bottom:0; padding:20px 24px; background:rgba(243,240,231,.96); border-top:4px solid var(--ink); }
    .caption b { display:block; font-size:clamp(20px,3vw,42px); line-height:1; }
    .caption span { display:block; margin-top:8px; font:700 14px/1.2 monospace; letter-spacing:.08em; }
    .controls { display:flex; align-items:center; gap:12px; margin-top:14px; }
    button { min-height:46px; padding:0 18px; border:3px solid var(--ink); background:var(--paper); color:var(--ink); font-weight:800; cursor:pointer; }
    button.primary { background:var(--teal); }
    .dots { display:flex; gap:8px; margin-left:auto; }
    .dot { width:14px; height:14px; border:2px solid var(--ink); background:transparent; }
    .dot.active { background:var(--ink); }
    .note { margin:12px 0 0; font:700 13px/1.4 monospace; }
    @media (prefers-reduced-motion:reduce) { .panel { transition:none; } }
  </style>
</head>
<body>
  <main class="manual">
    <div class="label">THREE PARTS · ONE CLEAN BUILD</div>
    <h1>SET UP LINKEDIN.<br>KEEP IT HUMAN.</h1>
    <section class="stage" aria-live="polite">
      <article class="panel active">
        <img src="01-dashboard-focus.png" alt="LinkedIn company dashboard showing the empty description, location and recent-post slots">
        <div class="caption"><b>01 — INSPECT THE EMPTY SLOTS</b><span>DESCRIPTION · LOCATION · PROOF</span></div>
      </article>
      <article class="panel">
        <img src="02-details-focus.png" alt="LinkedIn company details panel ready for the prepared public copy">
        <div class="caption"><b>02 — PLACE THREE PARTS</b><span>PROMISE · ABOUT · SECURE WEBSITE</span></div>
      </article>
      <article class="panel">
        <img src="03-member-focus.png" alt="Founder Above the Fold member-facing LinkedIn company page">
        <div class="caption"><b>03 — VIEW AS A MEMBER</b><span>SIMPLE · CREDIBLE · HUMAN</span></div>
      </article>
    </section>
    <div class="controls">
      <button id="previous" type="button">← Back</button>
      <button id="play" class="primary" type="button">Play smooth build</button>
      <button id="next" type="button">Next →</button>
      <div class="dots" aria-label="Assembly progress"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div>
    </div>
    <p class="note">NO SCRAPING · NO AUTO-DMS · NO AUTOMATED PROFILE EDITS · NO TRADE SECRETS</p>
  </main>
  <script>
    const panels=[...document.querySelectorAll('.panel')];
    const dots=[...document.querySelectorAll('.dot')];
    let index=0, timer;
    function show(next){ index=(next+panels.length)%panels.length; panels.forEach((p,i)=>p.classList.toggle('active',i===index)); dots.forEach((d,i)=>d.classList.toggle('active',i===index)); }
    function stop(){ clearInterval(timer); timer=undefined; document.querySelector('#play').textContent='Play smooth build'; }
    document.querySelector('#previous').onclick=()=>{ stop(); show(index-1); };
    document.querySelector('#next').onclick=()=>{ stop(); show(index+1); };
    document.querySelector('#play').onclick=()=>{ if(timer){ stop(); return; } show(0); document.querySelector('#play').textContent='Pause'; timer=setInterval(()=>show(index+1),3600); };
    document.addEventListener('keydown',event=>{ if(event.key==='ArrowLeft') document.querySelector('#previous').click(); if(event.key==='ArrowRight') document.querySelector('#next').click(); if(event.key===' ') { event.preventDefault(); document.querySelector('#play').click(); } });
  </script>
</body>
</html>
